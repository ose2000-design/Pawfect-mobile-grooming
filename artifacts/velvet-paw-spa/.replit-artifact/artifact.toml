kind = "web"
previewPath = "/"
title = "Velvet Paw Spa"
version = "1.0.0"
id = "artifacts/velvet-paw-spa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24343

[services.development]
run = "pnpm --filter @workspace/velvet-paw-spa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velvet-paw-spa", "run", "build" ]
publicDir = "artifacts/velvet-paw-spa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24343"
BASE_PATH = "/"
